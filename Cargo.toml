[package]
name = "emlbox"
version = "0.1.0"
edition = "2021"
description = "EMLBox — single-file .eml container: mmap reader, two-level index, append-only delta log, KV client"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
memmap2 = "0.9"

[profile.release]
opt-level = 3

[[bin]]
name = "rev-mcp"
path = "src/bin/rev-mcp.rs"

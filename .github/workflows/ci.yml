name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the library (the emlbox binary target does not compile yet: E0716 in src/main.rs)
        run: cargo build --lib --verbose

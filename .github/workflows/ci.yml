name: CI
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "Full build: library, binary, MCP server, integration tests"
        run: cargo build --all-targets --verbose
      - name: "Full test suite (79 tests)"
        run: cargo test --verbose
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "rustfmt (blocking)"
        run: cargo fmt --all -- --check
      - name: "Clippy (blocking: zero warnings)"
        run: cargo clippy --all-targets -- -D warnings
      - name: "Release build"
        run: cargo build --release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, checks]
    permissions:
      contents: write # attach release binaries to the GitHub release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: emlbox-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: emlbox-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: emlbox-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: "Build release binary"
        run: cargo build --release --target ${{ matrix.target }}
      - name: "Package"
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN=emlbox.exe; else BIN=emlbox; fi
          tar czf "${{ matrix.name }}.tar.gz" "$BIN"
          mv "${{ matrix.name }}.tar.gz" "$GITHUB_WORKSPACE/"
      - name: "Attach to the GitHub release"
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
